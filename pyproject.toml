[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tele-claude"
version = "0.2.1"
description = "Telegram bot for forwarding messages to Claude Code tmux panes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=22.7",
    # Already pulled in transitively by python-telegram-bot, but declared
    # explicitly because tele_claude_speech.py imports it directly.
    "aiohttp>=3.9",
]

[project.scripts]
# Dispatcher delegates to ``tele_claude:main`` when no subcommand is
# given (existing behavior) and to ``tele_claude_doctor:main`` for
# ``tele-claude doctor``. Keeping the bot import lazy lets ``doctor``
# run even when CLAUDE_TELEGRAM_* env vars aren't set yet — that's
# precisely the broken-install state doctor exists to diagnose.
tele-claude = "tele_claude_cli:main"
tele-claude-format = "tele_claude_format:main"

[dependency-groups]
dev = [
    "basedpyright>=1.38.3",
    "ruff>=0.15.7",
]

# Hatchling's auto-discovery for project name "tele-claude" picks exactly
# one of `tele_claude.py` OR `tele_claude/` as the wheel target — sibling
# `tele_claude_*.py` modules are NOT auto-included regardless of name.
# Without this block the built wheel ships only tele_claude.py and every
# install fails at import time with ModuleNotFoundError. Verified by
# `python -m build --wheel && unzip -l dist/*.whl` before/after.
[tool.hatch.build.targets.wheel]
include = ["tele_claude*.py"]

